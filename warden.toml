version = 1

[defaults]
runtime = "pi"
defaultBranch = "main"
failOn = "off"
reportOn = "medium"
maxFindings = 50
minConfidence = "medium"
reportOnSuccess = false

# Default for repository-aware analysis. Individual skills override this below.
[defaults.agent]
model = "openai-codex/gpt-6-luna"
maxTurns = 8
effort = "medium"

# Extraction, verification, deduplication, and fix-evaluation work.
[defaults.auxiliary]
model = "openai-codex/gpt-6-luna"
effort = "low"
maxRetries = 3

# Cross-location finding consolidation. This is not a sequential skill handoff.
[defaults.synthesis]
model = "openai-codex/gpt-6-luna"

[defaults.verification]
enabled = true

[defaults.chunking]
maxContextFiles = 20

[defaults.chunking.coalesce]
enabled = true
maxGapLines = 30
maxChunkSize = 10000

[runner]
# Bound parallel API usage while avoiding fully serial per-hunk analysis.
concurrency = 4

[[skills]]
name = "ui-usability-review"
model = "openai-codex/gpt-5.6-terra"
maxTurns = 10
paths = [
  "**/*.tsx",
  "**/*.jsx",
  "**/*.css",
  "**/*.scss",
]

[[skills.triggers]]
type = "local"

[[skills]]
name = "engineering-review"
model = "openai-codex/gpt-6-sol"
maxTurns = 10

[[skills.triggers]]
type = "local"
